name: APK fordítás

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: sherpa-onnx könyvtár letöltése
        run: |
          mkdir -p app/libs
          curl -sSL -o app/libs/sherpa-onnx-2.0.0.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.0/sherpa-onnx-2.0.0.aar
          ls -lh app/libs

      - name: APK fordítása
        run: gradle --no-daemon assembleRelease

      - name: APK átnevezése
        run: |
          mkdir -p kimenet
          cp app/build/outputs/apk/release/app-release.apk kimenet/Szinkrontolmacs.apk
          ls -lh kimenet

      - uses: actions/upload-artifact@v4
        with:
          name: Szinkrontolmacs-apk
          path: kimenet/Szinkrontolmacs.apk

      - name: Kiadás (letölthető a telefonról)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Szinkrontolmács 1.0.${{ github.run_number }}
          files: kimenet/Szinkrontolmacs.apk
